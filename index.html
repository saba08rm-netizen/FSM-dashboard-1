}

// ---------- Storage layer (Firestore) ----------
// Every dashboard "document" (sales sheets, budgets) lives in a single
// Firestore collection, one document per key. Reads are open to anyone per
// the security rules; writes require a signed-in user (see setup notes).
const FS_COLLECTION = "fsm-dashboard";

async function storageGetValue(key) {
  if (!fbDb) return null;
  try {
    const doc = await fbDb.collection(FS_COLLECTION).doc(key).get();
    return doc.exists ? doc.data().value : null;
  } catch (e) { return null; }
}

async function storageSetValue(key, value) {
  if (!fbDb) return false;
  try {
    await fbDb.collection(FS_COLLECTION).doc(key).set({ value, updatedAt: Date.now() });
    return true;
  } catch (e) { return false; }
}

}

const pct = (a, b) => (b === 0 ? 0 : ((a - b) / b) * 100);
const pctStr = (v) => `${v >= 0 ? "+" : ""}${v.toFixed(1)}%`;
const changeLabel = (cur, prior) => {
  if (prior === 0) return cur > 0 ? "New" : "—";
  return pctStr(pct(cur, prior));
};
const normCategory = (c) => (!c || c === "0" ? "Unclassified" : c);

// Cleans FSM's SAP export number formatting: " 6,650.40 ", "0.000 MVR", " -   "
function parseSapNum(s) {
  if (s == null) return 0;
  const cleaned = String(s).replace(/,/g, "").replace(/MVR/gi, "").trim();
  if (cleaned === "" || cleaned === "-") return 0;
  const v = parseFloat(cleaned);
  return isNaN(v) ? 0 : v;
}

// ---------- Minimal dependency-free SVG charts (line / bar) ----------
// Deliberately hand-rolled instead of pulling in a charting library, so the
// dashboard stays a single portable HTML file with no bundler.
function niceMax(v) {
  if (v <= 0) return 10;
  const mag = Math.pow(10, Math.floor(Math.log10(v)));
  const norm = v / mag;
  const step = norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10;
  return step * mag;
}

function ChartAxes({ w, h, pad, maxVal, xLabels, T, fmt }) {
  const ticks = 4;
  return (
    <>
      {[...Array(ticks + 1)].map((_, i) => {
        const y = pad.top + ((ticks - i) / ticks) * (h - pad.top - pad.bottom);
        const val = (maxVal / ticks) * i;
        return (
          <g key={i}>
            <line x1={pad.left} x2={w - pad.right} y1={y} y2={y} stroke={T.line} strokeWidth="1" />
            <text x={pad.left - 8} y={y + 4} fontSize="10.5" fill={T.sandDim} textAnchor="end" fontFamily="IBM Plex Sans">
              {fmt ? fmt(val) : Math.round(val)}
            </text>
          </g>
        );
      })}
      {xLabels.map((lab, i) => {
        const x = pad.left + (i / (xLabels.length - 1 || 1)) * (w - pad.left - pad.right);
        return (
          <text key={lab} x={x} y={h - pad.bottom + 16} fontSize="10.5" fill={T.sandDim} textAnchor="middle" fontFamily="IBM Plex Sans">
            {lab}
          </text>
        );
      })}
    </>
  );
}

function SimpleLineChart({ data, seriesKeys, colors, height = 280, T, fmt, xKey = "month" }) {
  const w = 900, pad = { top: 14, right: 16, bottom: 30, left: 44 };
  const maxRaw = Math.max(1, ...data.flatMap((d) => seriesKeys.map((k) => d[k] || 0)));
  const maxVal = niceMax(maxRaw) || 1;
  const xLabels = data.map((d) => d[xKey]);
  const px = (i) => pad.left + (i / ((data.length - 1) || 1)) * (w - pad.left - pad.right);
  const py = (v) => (height - pad.bottom) - (v / maxVal) * (height - pad.top - pad.bottom);
  return (
    <svg viewBox={`0 0 ${w} ${height}`} width="100%" height={height} preserveAspectRatio="none" style={{ overflow: "visible" }}>
      <ChartAxes w={w} h={height} pad={pad} maxVal={maxVal} xLabels={xLabels} T={T} fmt={fmt} />
      {seriesKeys.map((key, si) => {
        const pts = data.map((d, i) => [px(i), py(d[key] || 0)]);
        const dPath = pts.map((p, i) => `${i === 0 ? "M" : "L"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
        return (
          <g key={key}>
            <path d={dPath} fill="none" stroke={colors[si % colors.length]} strokeWidth="2.5" />
            {pts.map((p, i) => (
              <circle key={i} cx={p[0]} cy={p[1]} r="3" fill={colors[si % colors.length]}>
                <title>{`${key} · ${xLabels[i]}: ${fmt ? fmt(data[i][key] || 0) : data[i][key] || 0}`}</title>
              </circle>
            ))}
          </g>
        );
      })}
    </svg>
  );
}

function SimpleBarChart({ data, seriesKeys, colors, height = 260, T, fmt, xKey = "month" }) {
  const w = 900, pad = { top: 14, right: 16, bottom: 30, left: 44 };
  const maxRaw = Math.max(1, ...data.flatMap((d) => seriesKeys.map((k) => d[k] || 0)));
  const maxVal = niceMax(maxRaw) || 1;
  const xLabels = data.map((d) => d[xKey]);
  const groupW = (w - pad.left - pad.right) / data.length;
  const barW = Math.min(14, (groupW * 0.6) / seriesKeys.length);
  const py = (v) => (height - pad.bottom) - (v / maxVal) * (height - pad.top - pad.bottom);
  return (
    <svg viewBox={`0 0 ${w} ${height}`} width="100%" height={height} preserveAspectRatio="none" style={{ overflow: "visible" }}>
      <ChartAxes w={w} h={height} pad={pad} maxVal={maxVal} xLabels={xLabels} T={T} fmt={fmt} />
      {data.map((d, gi) => {
        const groupX = pad.left + gi * groupW + groupW / 2 - (barW * seriesKeys.length) / 2;
        return seriesKeys.map((key, si) => {
          const val = d[key] || 0;
          const y = py(val);
          return (
            <rect
              key={key} x={groupX + si * barW} y={y} width={barW - 2}
              height={(height - pad.bottom) - y} rx="1.5" fill={colors[si % colors.length]}
            >
              <title>{`${key} · ${d[xKey]}: ${fmt ? fmt(val) : val}`}</title>
            </rect>
          );
        });
      })}
    </svg>
  );
}

function FSMDashboard() {
  // Each uploaded CSV is kept as its own named "sheet" (batch) so any one
  // month/period can be replaced or removed without touching the others.
  // batches: [{ id, label, uploadedAt, rows }]
  const [batches, setBatches] = useState([]);
  const [section, setSection] = useState("overview");
  const [year, setYear] = useState(2026);
  const [month, setMonth] = useState(2); // Mar (0-indexed) — the month real data is available for
  const [uploadError, setUploadError] = useState("");
  const [loadingShared, setLoadingShared] = useState(true);
  const [savingShared, setSavingShared] = useState(false);
  const fileRef = useRef(null);

  // Day / night mode — personal display preference, kept in this browser only
  const [theme, setTheme] = useState(() => {
    try { return localStorage.getItem("fsm-theme") || "dark"; } catch (e) { return "dark"; }
  });
  const T = theme === "dark" ? DARK : LIGHT;
  function toggleTheme() {
    setTheme((prev) => {
      const next = prev === "dark" ? "light" : "dark";
      try { localStorage.setItem("fsm-theme", next); } catch (e) {}
      return next;
    });
  }

  // Edit access — Firebase Authentication. Anyone can view the dashboard;
  // only people signed in (accounts added by an admin in the Firebase
  // console → Authentication tab) can upload sheets, remove sheets, or set
  // budgets. This is enforced server-side by Firestore security rules, not
  // just hidden in the UI — a real access control, not an honor system.
  const [authUser, setAuthUser] = useState(null);
  const [authLoading, setAuthLoading] = useState(true);
  const [signInEmail, setSignInEmail] = useState("");
  const [signInPassword, setSignInPassword] = useState("");
  const [authError, setAuthError] = useState("");
  const isEditor = !!authUser;

  React.useEffect(() => {
    if (!fbAuth) { setAuthLoading(false); return; }
    const unsub = fbAuth.onAuthStateChanged((user) => {
      setAuthUser(user);
      setAuthLoading(false);
    });
    return () => unsub();
  }, []);

  async function handleSignIn() {
    if (!fbAuth) return;
    setAuthError("");
    try {
      await fbAuth.signInWithEmailAndPassword(signInEmail.trim(), signInPassword);
      setSignInPassword("");
    } catch (e) {
      setAuthError(e.code === "auth/invalid-credential" || e.code === "auth/wrong-password" || e.code === "auth/user-not-found"
        ? "Email or password doesn't match an editor account."
        : "Couldn't sign in — check the console for details.");
    }
  }

  function handleSignOut() {
    if (fbAuth) fbAuth.signOut();
  }


  const usingSample = batches.length === 0;
  const rawData = usingSample ? MARCH_2026_DATA : batches.flatMap((b) => b.rows);

  // Global filters — applied on top of raw/uploaded data, before every downstream calculation
  const [filters, setFilters] = useState({ atoll: "", island: "", shippingPoint: "", product: "", category: "", channel: "" });

  const filterOptions = useMemo(() => ({
    atoll: [...new Set(rawData.map((r) => r.atoll).filter(Boolean))].sort(),
    island: [...new Set(rawData.map((r) => r.island).filter(Boolean))].sort(),
    shippingPoint: [...new Set(rawData.map((r) => r.shippingPoint).filter(Boolean))].sort(),
    product: [...new Set(rawData.map((r) => r.product).filter(Boolean))].sort(),
    category: [...new Set(rawData.map((r) => normCategory(r.category)))].sort(),
    channel: [...new Set(rawData.map((r) => r.channel).filter(Boolean))].sort(),
  }), [rawData]);

  const activeFilterCount = Object.values(filters).filter(Boolean).length;

  const data = useMemo(() => {
    if (activeFilterCount === 0) return rawData;
    return rawData.filter((r) => {
      if (filters.atoll && r.atoll !== filters.atoll) return false;
      if (filters.island && r.island !== filters.island) return false;
      if (filters.shippingPoint && r.shippingPoint !== filters.shippingPoint) return false;
      if (filters.product && r.product !== filters.product) return false;
      if (filters.category && normCategory(r.category) !== filters.category) return false;
      if (filters.channel && r.channel !== filters.channel) return false;
      return true;
    });
  }, [rawData, filters, activeFilterCount]);

  // Load shared sheets (visible to anyone who opens this dashboard) on mount
  React.useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const val = await storageGetValue("fsm-sales-batches", true);
        if (!cancelled && val) {
          const parsed = JSON.parse(val);
          if (Array.isArray(parsed)) setBatches(parsed);
        }
      } catch (err) {
        // No shared sheets saved yet — fall back to sample data silently.
      } finally {
        if (!cancelled) setLoadingShared(false);
      }
    })();
    return () => { cancelled = true; };
  }, []);

  async function saveShared(nextBatches) {
    setSavingShared(true);
    try {
      const ok = await storageSetValue("fsm-sales-batches", JSON.stringify(nextBatches), true);
      if (!ok) setUploadError("Saved locally, but shared storage failed — others won't see this update.");
    } catch (err) {
      setUploadError("Saved locally, but shared storage failed — others won't see this update.");
    } finally {
      setSavingShared(false);
    }
  }

  // What-if state
  const [volChange, setVolChange] = useState(0);
  const [priceChange, setPriceChange] = useState(0);
  const [retention, setRetention] = useState(100);

  // Monthly budgets / projections — shared, keyed by "year-month"
  const [budgets, setBudgets] = useState({});
  const [loadingBudgets, setLoadingBudgets] = useState(true);

  React.useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const val = await storageGetValue("fsm-budgets", true);
        if (!cancelled && val) {
          const parsed = JSON.parse(val);
          if (parsed && typeof parsed === "object") setBudgets(parsed);
        }
      } catch (err) {
        // No budgets saved yet.
      } finally {
        if (!cancelled) setLoadingBudgets(false);
      }
    })();
    return () => { cancelled = true; };
  }, []);

  async function saveBudget(monthKey, field, rawValue) {
    const numVal = rawValue === "" ? 0 : parseFloat(rawValue);
    setBudgets((prev) => {
      const next = {
        ...prev,
        [monthKey]: { ...(prev[monthKey] || { volume: 0, value: 0 }), [field]: isNaN(numVal) ? 0 : numVal },
      };
      storageSetValue("fsm-budgets", JSON.stringify(next), true).catch(() => {});
      return next;
    });
  }

  const years = useMemo(() => [...new Set(data.map((r) => r.year))].sort(), [data]);

  function handleUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    Papa.parse(file, {
      header: true, skipEmptyLines: true,
      transformHeader: (h) => h.trim(),
      complete: (res) => {
        try {
          const isSapExport = res.meta.fields.includes("Billing Date") && res.meta.fields.includes("Sold-to Party10");

          const rows = res.data.map((r) => {
            if (isSapExport) {
              // Raw FSM SAP billing export — used as-is, no reformatting needed.
              const dateStr = (r["Billing Date"] || "").trim();
              const d = new Date(dateStr);
              const qty = parseSapNum(r["Quantity (Ltrs)"]);
              const value = parseSapNum(r["Net Value (MVR)"]);
              const cogs = parseSapNum(r["COGS"]);
              const margin = parseSapNum(r["Margin_Value"]);
              return {
                date: dateStr, year: d.getFullYear(), month: d.getMonth(),
                customer: (r["Sold-to Party10"] || "").trim(),
                island: (r["Island"] || "").trim(),
                atoll: (r["Atoll"] || "").trim(),
                shippingPoint: (r["Plant2"] || "").trim() || "Unassigned",
                product: (r["Product13"] || "").trim() || "Unspecified",
                category: (r["Main Category"] || "").trim(),
                channel: (r["Distribution Channel16"] || "").trim(),
                quantity: qty, rate: qty ? value / qty : parseSapNum(r["SP / Ltr"]), value,
                cogs, margin,
              };
            }
            // Simplified format fallback: Date, Customer, Island, Shipping Point, Product, Quantity, Rate, Sales Value
            const d = new Date(r.Date || r.date);
            const qty = parseFloat(r.Quantity || r.quantity);
            const rate = parseFloat(r.Rate || r.rate);
            const val = parseFloat(r["Sales Value"] || r.value) || qty * rate;
            return {
              date: r.Date || r.date, year: d.getFullYear(), month: d.getMonth(),
              customer: r.Customer || r.customer,
              island: r.Island || r.island,
              atoll: r.Atoll || "",
              shippingPoint: r["Shipping Point"] || r.shippingPoint,
              product: r.Product || r.product,
              channel: "",
              quantity: qty, rate, value: val, cogs: 0, margin: 0,
            };
          }).filter((r) => r.customer && r.quantity > 0 && !isNaN(r.year));
          if (rows.length === 0) throw new Error("No valid rows found");

          // A re-upload of the same filename replaces that sheet in place;
          // a new filename is added alongside the others.
          const label = file.name;
          setBatches((prev) => {
            const withoutMatch = prev.filter((b) => b.label !== label);
            const next = [...withoutMatch, { id: `${label}-${Date.now()}`, label, uploadedAt: new Date().toISOString(), rows }];
            saveShared(next);
            return next;
          });
          setUploadError("");
        } catch (err) {
          setUploadError("Couldn't read that file — check the column headers match the expected format.");
        }
      },
      error: () => setUploadError("Couldn't parse that file."),
    });
    e.target.value = ""; // allow re-selecting the same file later
  }

  function removeBatch(id) {
    setBatches((prev) => {
      const next = prev.filter((b) => b.id !== id);
      saveShared(next);
      return next;
    });
  }

  // ---- Derived aggregates ----
  const mtd = useMemo(() => data.filter((r) => r.year === year && r.month === month), [data, year, month]);
  const mtdPrior = useMemo(() => data.filter((r) => r.year === year - 1 && r.month === month), [data, year, month]);

  const sum = (rows, key) => rows.reduce((a, r) => a + r[key], 0);
  const uniq = (rows, key) => new Set(rows.map((r) => r[key])).size;

  const curVal = sum(mtd, "value"), priorVal = sum(mtdPrior, "value");
  const curQty = sum(mtd, "quantity"), priorQty = sum(mtdPrior, "quantity");
  const curCust = uniq(mtd, "customer"), priorCust = uniq(mtdPrior, "customer");
  const curAvg = curQty ? curVal / curQty : 0, priorAvg = priorQty ? priorVal / priorQty : 0;

  const monthlyByYear = useMemo(() => {
    return MONTHS.map((label, m) => {
      const row = { month: label };
      years.forEach((y) => {
        row[y] = sum(data.filter((r) => r.year === y && r.month === m), "quantity");
      });
      return row;
    });
  }, [data, years]);

  const byIsland = useMemo(() => {
    const names = [...new Set(data.map((r) => r.island).filter(Boolean))];
    return names.map((isl) => ({
      island: isl,
      cur: sum(data.filter((r) => r.year === year && r.island === isl), "quantity"),
      prior: sum(data.filter((r) => r.year === year - 1 && r.island === isl), "quantity"),
      curVal: sum(data.filter((r) => r.year === year && r.island === isl), "value"),
    })).filter((r) => r.cur > 0 || r.prior > 0).sort((a, b) => b.cur - a.cur);
  }, [data, year]);

  const byShipPoint = useMemo(() => {
    const names = [...new Set(data.map((r) => r.shippingPoint).filter(Boolean))];
    return names.map((sp) => ({
      shippingPoint: sp,
      cur: sum(data.filter((r) => r.year === year && r.shippingPoint === sp), "quantity"),
      prior: sum(data.filter((r) => r.year === year - 1 && r.shippingPoint === sp), "quantity"),
      curVal: sum(data.filter((r) => r.year === year && r.shippingPoint === sp), "value"),
    })).filter((r) => r.cur > 0 || r.prior > 0).sort((a, b) => b.cur - a.cur);
  }, [data, year]);

  const byCustomer = useMemo(() => {
    const names = [...new Set(data.map((r) => r.customer).filter(Boolean))];
    return names.map((name) => ({
      customer: name,
      cur: sum(data.filter((r) => r.year === year && r.customer === name), "quantity"),
      prior: sum(data.filter((r) => r.year === year - 1 && r.customer === name), "quantity"),
      curVal: sum(data.filter((r) => r.year === year && r.customer === name), "value"),
    })).filter((r) => r.cur > 0 || r.prior > 0).sort((a, b) => b.cur - a.cur).slice(0, 10);
  }, [data, year]);

  const byAtoll = useMemo(() => {
    const names = [...new Set(data.map((r) => r.atoll).filter(Boolean))];
    return names.map((atoll) => ({
      atoll,
      cur: sum(data.filter((r) => r.year === year && r.atoll === atoll), "quantity"),
      prior: sum(data.filter((r) => r.year === year - 1 && r.atoll === atoll), "quantity"),
      curVal: sum(data.filter((r) => r.year === year && r.atoll === atoll), "value"),
    })).filter((r) => r.cur > 0 || r.prior > 0).sort((a, b) => b.cur - a.cur);
  }, [data, year]);

  // Full customer league table for this period, with cumulative volume share —
  // used for concentration (top 10 / top 20) and low-performer flagging.
  const customerConcentration = useMemo(() => {
    const names = [...new Set(mtd.map((r) => r.customer).filter(Boolean))];
    const totalQty = sum(mtd, "quantity") || 1;
    const list = names.map((name) => {
      const rows = mtd.filter((r) => r.customer === name);
      return { customer: name, quantity: sum(rows, "quantity"), value: sum(rows, "value") };
    }).sort((a, b) => b.quantity - a.quantity);
    let running = 0;
    return list.map((c) => {
      running += c.quantity;
      return { ...c, share: (c.quantity / totalQty) * 100, cumShare: (running / totalQty) * 100 };
    });
  }, [mtd]);

  const top10Share = useMemo(() => customerConcentration.slice(0, 10).reduce((a, c) => a + c.share, 0), [customerConcentration]);
  const top20Share = useMemo(() => customerConcentration.slice(0, 20).reduce((a, c) => a + c.share, 0), [customerConcentration]);

  // Customer activity across every month actually loaded (not just the selected period) —
  // compares the most recent loaded month to all prior months to flag lapsed/declining accounts.
  // Measured in litres, so a customer switching to a cheaper product doesn't look like churn.
  const customerActivity = useMemo(() => {
    const monthKeys = [...new Set(data.map((r) => `${r.year}-${r.month}`))].sort();
    if (monthKeys.length < 2) return { insufficientData: true, monthKeys };
    const latestKey = monthKeys[monthKeys.length - 1];
    const priorKeys = monthKeys.slice(0, -1);
    const latestCustomers = new Map();
    data.filter((r) => `${r.year}-${r.month}` === latestKey).forEach((r) => {
      latestCustomers.set(r.customer, (latestCustomers.get(r.customer) || 0) + r.quantity);
    });
    const historicCustomers = new Map();
    data.filter((r) => priorKeys.includes(`${r.year}-${r.month}`)).forEach((r) => {
      historicCustomers.set(r.customer, (historicCustomers.get(r.customer) || 0) + r.quantity);
    });
    const active = [...latestCustomers.keys()];
    const lapsed = [...historicCustomers.keys()].filter((c) => !latestCustomers.has(c))
      .map((c) => ({ customer: c, priorQty: historicCustomers.get(c) }))
      .sort((a, b) => b.priorQty - a.priorQty);
    const declining = active
      .filter((c) => historicCustomers.has(c))
      .map((c) => ({ customer: c, cur: latestCustomers.get(c), prior: historicCustomers.get(c) / priorKeys.length }))
      .filter((c) => c.cur < c.prior * 0.8)
      .sort((a, b) => (a.cur - a.prior) - (b.cur - b.prior));
    return { insufficientData: false, activeCount: active.length, lapsed, declining, monthKeys };
  }, [data]);

  // Product performance: volume-led, with revenue and margin per litre alongside
  const byProduct = useMemo(() => {
    const names = [...new Set(mtd.map((r) => r.product).filter(Boolean))];
    return names.map((product) => {
      const rows = mtd.filter((r) => r.product === product);
      const qty = sum(rows, "quantity"), val = sum(rows, "value"), margin = sum(rows, "margin");
      return { product, quantity: qty, value: val, margin, gpPerLitre: qty ? margin / qty : 0 };
    }).sort((a, b) => b.quantity - a.quantity);
  }, [mtd]);

  // Customer profitability: who drives margin, not just revenue
  const customerProfitability = useMemo(() => {
    const names = [...new Set(mtd.map((r) => r.customer).filter(Boolean))];
    return names.map((customer) => {
      const rows = mtd.filter((r) => r.customer === customer);
      const qty = sum(rows, "quantity"), val = sum(rows, "value"), margin = sum(rows, "margin");
      return { customer, quantity: qty, value: val, margin, gpPerLitre: qty ? margin / qty : 0 };
    }).filter((c) => c.value > 0).sort((a, b) => b.margin - a.margin).slice(0, 10);
  }, [mtd]);

  const totalMargin = sum(mtd, "margin");
  const marginPct = curVal ? (totalMargin / curVal) * 100 : 0;

  // Sales by category (SOE, Government, Resorts, Island Delivery, Bunker, etc.)
  const byCategory = useMemo(() => {
    const cats = [...new Set(mtd.map((r) => normCategory(r.category)))];
    return cats.map((cat) => {
      const rows = mtd.filter((r) => normCategory(r.category) === cat);
      const qty = sum(rows, "quantity"), val = sum(rows, "value"), margin = sum(rows, "margin");
      return { category: cat, quantity: qty, value: val, margin, gpPerLitre: qty ? margin / qty : 0, customers: uniq(rows, "customer") };
    }).filter((c) => c.quantity > 0).sort((a, b) => b.quantity - a.quantity);
  }, [mtd]);

  // Below-cost sales — line items where net value is under COGS, kept separate
  // from normal profitability so loss-making volume doesn't hide inside blended margins.
  const belowCostSales = useMemo(() => {
    return mtd.filter((r) => r.margin < 0)
      .map((r) => ({ ...r }))
      .sort((a, b) => a.margin - b.margin);
  }, [mtd]);
  const belowCostQty = sum(belowCostSales, "quantity");
  const belowCostVal = sum(belowCostSales, "value");
  const belowCostMargin = sum(belowCostSales, "margin");
  const belowCostShareOfVolume = curQty ? (belowCostQty / curQty) * 100 : 0;

  // Monthly budget vs actual, for every month of the selected year
  const monthlyBudgetRows = useMemo(() => {
    return MONTHS.map((label, m) => {
      const key = `${year}-${m}`;
      const b = budgets[key] || { volume: 0, value: 0 };
      const rows = data.filter((r) => r.year === year && r.month === m);
      const hasActual = rows.length > 0;
      const actualVol = sum(rows, "quantity");
      const actualVal = sum(rows, "value");
      return {
        key, label, m,
        budgetVol: b.volume || 0, budgetVal: b.value || 0,
        actualVol, actualVal, hasActual,
        attainVol: b.volume ? (actualVol / b.volume) * 100 : null,
        attainVal: b.value ? (actualVal / b.value) * 100 : null,
      };
    });
  }, [budgets, data, year]);

  const whatIf = useMemo(() => {
    const baseQty = curQty * (retention / 100);
    const projQty = baseQty * (1 + volChange / 100);
    const projRate = curQty ? (curVal / curQty) + priceChange : 0;
    const projVal = projQty * projRate;
    return { projQty, projRate, projVal, deltaVal: projVal - curVal };
  }, [curQty, curVal, volChange, priceChange, retention]);

  const navBtnStyle = (active) => ({
    display: "flex", alignItems: "center", gap: 10, width: "100%",
    padding: "10px 14px", borderRadius: 4, border: "none", cursor: "pointer",
    background: active ? T.panelAlt : "transparent",
    color: active ? T.sand : T.sandDim,
    fontFamily: "'IBM Plex Sans'", fontSize: 13.5, fontWeight: 500,
    textAlign: "left", marginBottom: 2,
  });

  const selectStyle = {
    background: T.panelAlt, color: T.sand, border: `1px solid ${T.line}`,
    borderRadius: 4, padding: "7px 10px", fontFamily: "'IBM Plex Sans'", fontSize: 13,
  };

  return (
    <ThemeContext.Provider value={T}>
    <div style={{ display: "flex", minHeight: "100vh", background: T.bg, fontFamily: "'IBM Plex Sans'" }}>
      {/* Sidebar */}
      <div style={{ width: 210, borderRight: `1px solid ${T.line}`, padding: "22px 14px", flexShrink: 0 }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "0 8px 4px" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <svg width="26" height="26" viewBox="0 0 32 32" fill="none">
              <path d="M16 3c5 6 9 10.8 9 15.4A9 9 0 1 1 7 18.4C7 13.8 11 9 16 3z" fill={T.amber} />
              <path d="M16 12c2.6 3.1 4.6 5.5 4.6 7.8a4.6 4.6 0 1 1-9.2 0c0-2.3 2-4.7 4.6-7.8z" fill={T.bg} opacity="0.55" />
            </svg>
            <div style={{ fontFamily: "'Oswald'", fontSize: 19, color: T.sand, fontWeight: 600, letterSpacing: 0.3, lineHeight: 1 }}>
              FSM
            </div>
          </div>
          <button
            onClick={toggleTheme}
            title={theme === "dark" ? "Switch to day mode" : "Switch to night mode"}
            style={{
              background: "none", border: `1px solid ${T.line}`, borderRadius: 4,
              color: T.sand, padding: 6, cursor: "pointer", display: "flex",
            }}
          >
            <Icon name={theme === "dark" ? "sun" : "moon"} size={13} />
          </button>
        </div>
        <div style={{ fontSize: 11.5, color: T.sandDim, padding: "0 8px 22px" }}>Live sales intelligence</div>
        {NAV.map((n) => (
          <button key={n.key} style={navBtnStyle(section === n.key)} onClick={() => setSection(n.key)}>
            <Icon name={n.icon} size={15} strokeWidth={2} />
            {n.label}
          </button>
        ))}

        <div style={{ marginTop: 26, padding: "12px 8px", borderTop: `1px solid ${T.line}` }}>
          <div style={{ fontSize: 11, color: T.sandDim, marginBottom: 8 }}>EDIT ACCESS</div>
          {FIREBASE_NOT_CONFIGURED ? (
            <div style={{ fontSize: 11.5, color: T.amber, lineHeight: 1.5 }}>
              Firebase isn't configured yet — see the setup banner above. Sign-in will work once it's connected.
            </div>
          ) : authLoading ? (
            <div style={{ fontSize: 11.5, color: T.sandDim }}>Checking…</div>
          ) : isEditor ? (
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 6 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: T.green, overflow: "hidden" }}>
                <Icon name="unlock" size={13} style={{ flexShrink: 0 }} />
                <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }} title={authUser.email}>{authUser.email}</span>
              </div>
              <button onClick={handleSignOut} title="Sign out" style={{ background: "none", border: "none", color: T.sandDim, cursor: "pointer", padding: 2, flexShrink: 0 }}>
                <Icon name="x" size={12} />
              </button>
            </div>
          ) : (
            <div>
              <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12.5, color: T.sandDim, marginBottom: 6 }}>
                <Icon name="lock" size={13} /> View-only — sign in to edit
              </div>
              <input
                type="email" value={signInEmail} onChange={(e) => setSignInEmail(e.target.value)}
                placeholder="Email"
                style={{ width: "100%", background: T.panelAlt, border: `1px solid ${T.line}`, borderRadius: 4, color: T.sand, padding: "6px 8px", fontSize: 12.5, marginBottom: 6, boxSizing: "border-box" }}
              />
              <input
                type="password" value={signInPassword} onChange={(e) => setSignInPassword(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && handleSignIn()}
                placeholder="Password"
                style={{ width: "100%", background: T.panelAlt, border: `1px solid ${T.line}`, borderRadius: 4, color: T.sand, padding: "6px 8px", fontSize: 12.5, marginBottom: 6, boxSizing: "border-box" }}
              />
              <button
                onClick={handleSignIn}
                style={{ width: "100%", background: "none", border: `1px solid ${T.line}`, borderRadius: 4, color: T.sand, padding: "6px 8px", fontSize: 12.5, cursor: "pointer" }}
              >
                Sign in
              </button>
              <div style={{ fontSize: 10.5, color: T.sandDim, marginTop: 6, lineHeight: 1.5 }}>
                Editor accounts are added in the Firebase console — ask whoever set this dashboard up.
              </div>
            </div>
          )}
          {authError && <div style={{ fontSize: 11, color: T.red, marginTop: 6 }}>{authError}</div>}
        </div>

        <div style={{ marginTop: 14, padding: "12px 8px", borderTop: `1px solid ${T.line}` }}>
          <div style={{ fontSize: 11, color: T.sandDim, marginBottom: 8 }}>DATA SHEETS — SHARED</div>
          <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12.5, color: usingSample ? T.amber : T.green, marginBottom: 10 }}>
            <Icon name="circle" size={7} fill="currentColor" stroke="none" />
            {loadingShared ? "Loading…" : savingShared ? "Saving…" : usingSample ? "Sample: March 2026 (real)" : `${batches.length} sheet${batches.length === 1 ? "" : "s"} uploaded`}
          </div>

          {!usingSample && (
            <div style={{ marginBottom: 10 }}>
              {batches.map((b) => (
                <div key={b.id} style={{
                  display: "flex", alignItems: "center", justifyContent: "space-between",
                  gap: 6, padding: "5px 0", borderBottom: `1px solid ${T.line}`,
                }}>
                  <div style={{ fontSize: 11.5, color: T.sand, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }} title={b.label}>
                    {b.label}
                  </div>
                  {isEditor && (
                    <button
                      onClick={() => removeBatch(b.id)}
                      title="Remove this sheet"
                      style={{ background: "none", border: "none", color: T.red, cursor: "pointer", fontSize: 13, padding: "0 2px", flexShrink: 0 }}
                    >
                      ×
                    </button>
                  )}
                </div>
              ))}
            </div>
          )}

          {isEditor ? (
            <>
              <button
                onClick={() => fileRef.current.click()}
                style={{
                  display: "flex", alignItems: "center", gap: 6, width: "100%",
                  background: "none", border: `1px solid ${T.line}`, borderRadius: 4,
                  color: T.sand, padding: "7px 10px", fontSize: 12.5, cursor: "pointer",
                }}
              >
                <Icon name="upload" size={13} /> Upload CSV
              </button>
              <input ref={fileRef} type="file" accept=".csv" onChange={handleUpload} style={{ display: "none" }} />
              {uploadError && <div style={{ fontSize: 11, color: T.red, marginTop: 6 }}>{uploadError}</div>}
              <div style={{ fontSize: 10.5, color: T.sandDim, marginTop: 8, lineHeight: 1.5 }}>
                Visible to anyone who opens this dashboard. Re-uploading a file with the same
                name replaces that sheet; a new filename adds alongside it. Upload your raw
                FSM SAP billing export as-is (no reformatting needed) or a simplified CSV with
                Date, Customer, Island, Shipping Point, Product, Quantity, Rate, Sales Value.
              </div>
            </>
          ) : (
            <div style={{ fontSize: 11, color: T.sandDim, lineHeight: 1.5 }}>
              Unlock editing above to upload sales sheets.
            </div>
          )}
        </div>
      </div>

      {/* Main */}
      <div style={{ flex: 1, padding: "22px 28px", maxWidth: 1180 }}>
        {FIREBASE_NOT_CONFIGURED && (
          <div style={{
            background: T.panelAlt, border: `1px solid ${T.amber}`, borderRadius: 4,
            padding: "14px 16px", marginBottom: 20, fontSize: 12.5, color: T.sand, lineHeight: 1.7,
          }}>
            <div style={{ fontFamily: "'Oswald'", fontSize: 14, color: T.amber, marginBottom: 6 }}>
              Firebase not connected — running on sample data only
            </div>
            Everyone currently sees the same built-in March 2026 sample, and uploads/budgets won't save.
            To connect real shared storage: create a free project at{" "}
            <span style={{ color: T.cyan }}>console.firebase.google.com</span>, enable{" "}
            <b>Firestore Database</b> and <b>Authentication → Email/Password</b>, add editor accounts
            under Authentication → Users, then paste your project's config into the{" "}
            <span style={{ fontFamily: "'IBM Plex Mono'" }}>FIREBASE_CONFIG</span> object near the top of
            this file's source and set the Firestore security rules as documented alongside this file.
          </div>
        )}
        {/* Period bar */}
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 22 }}>
          <select value={month} onChange={(e) => setMonth(+e.target.value)} style={selectStyle}>
            {MONTHS.map((m, i) => <option key={m} value={i}>{m}</option>)}
          </select>
          <select value={year} onChange={(e) => setYear(+e.target.value)} style={selectStyle}>
            {years.map((y) => <option key={y} value={y}>{y}</option>)}
          </select>
          <div style={{ color: T.sandDim, fontSize: 12.5, marginLeft: 4 }}>
            vs {MONTHS[month]} {year - 1} <Icon name="chevronright" size={11} style={{ display: "inline", verticalAlign: -1 }} />
          </div>
        </div>

        {/* Filter bar — applies to every section below */}
        <div style={{
          display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap",
          marginBottom: 22, padding: "12px 14px", background: T.panel,
          border: `1px solid ${T.line}`, borderRadius: 4,
        }}>
          <Icon name="filter" size={13} color={T.sandDim} style={{ flexShrink: 0 }} />
          <select value={filters.atoll} onChange={(e) => setFilters((f) => ({ ...f, atoll: e.target.value }))} style={selectStyle}>
            <option value="">All atolls</option>
            {filterOptions.atoll.map((v) => <option key={v} value={v}>{v}</option>)}
          </select>
          <select value={filters.island} onChange={(e) => setFilters((f) => ({ ...f, island: e.target.value }))} style={selectStyle}>
            <option value="">All islands</option>
            {filterOptions.island.map((v) => <option key={v} value={v}>{v}</option>)}
          </select>
          <select value={filters.shippingPoint} onChange={(e) => setFilters((f) => ({ ...f, shippingPoint: e.target.value }))} style={selectStyle}>
            <option value="">All shipping points</option>
            {filterOptions.shippingPoint.map((v) => <option key={v} value={v}>{v}</option>)}
          </select>
          <select value={filters.product} onChange={(e) => setFilters((f) => ({ ...f, product: e.target.value }))} style={selectStyle}>
            <option value="">All products</option>
            {filterOptions.product.map((v) => <option key={v} value={v}>{v}</option>)}
          </select>
          <select value={filters.category} onChange={(e) => setFilters((f) => ({ ...f, category: e.target.value }))} style={selectStyle}>
            <option value="">All categories</option>
            {filterOptions.category.map((v) => <option key={v} value={v}>{v}</option>)}
          </select>
          {filterOptions.channel.length > 0 && (
            <select value={filters.channel} onChange={(e) => setFilters((f) => ({ ...f, channel: e.target.value }))} style={selectStyle}>
              <option value="">All channels</option>
              {filterOptions.channel.map((v) => <option key={v} value={v}>{v}</option>)}
            </select>
          )}
          {activeFilterCount > 0 && (
            <button
              onClick={() => setFilters({ atoll: "", island: "", shippingPoint: "", product: "", category: "", channel: "" })}
              style={{
                display: "flex", alignItems: "center", gap: 5, background: "none",
                border: `1px solid ${T.line}`, borderRadius: 4, color: T.amber,
                padding: "7px 10px", fontSize: 12.5, cursor: "pointer", marginLeft: 2,
              }}
            >
              <Icon name="x" size={12} /> Clear {activeFilterCount} filter{activeFilterCount === 1 ? "" : "s"}
            </button>
          )}
        </div>

        {section === "overview" && (
          <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
            <div style={{ display: "flex", gap: 14, flexWrap: "wrap" }}>
              <StatCard label="Volume sold (MTD)" value={fmtL(curQty)} sub={changeLabel(curQty, priorQty) + " vs LY"} tone={curQty >= priorQty ? "up" : "down"} />
              <StatCard label="Sales value" value={fmtMVR(curVal)} sub={changeLabel(curVal, priorVal) + " vs LY"} tone={curVal >= priorVal ? "up" : "down"} />
              <StatCard label="Active customers" value={curCust} sub={changeLabel(curCust, priorCust) + " vs LY"} tone={curCust >= priorCust ? "up" : "down"} />
              <StatCard label="Avg. rate / litre" value={`MVR ${curAvg.toFixed(2)}`} sub={changeLabel(curAvg, priorAvg) + " vs LY"} tone={curAvg >= priorAvg ? "up" : "down"} />
            </div>

            <Panel title="Monthly sales volume by year">
              <SimpleLineChart
                data={monthlyByYear} seriesKeys={years} T={T} fmt={fmtL}
                colors={years.map((y, i) => (i === years.length - 1 ? T.amber : T.cyan))}
              />
              <ChartLegend seriesKeys={years} T={T} colors={years.map((y, i) => (i === years.length - 1 ? T.amber : T.cyan))} />
            </Panel>

            <div style={{ display: "flex", gap: 18 }}>
              <Panel title="Top islands by volume (this period)" style={{ flex: 1 }}>
                <Table
                  columns={[
                    { key: "island", label: "Island", emphasize: true },
                    { key: "cur", label: "Volume", align: "right", render: (r) => fmtL(r.cur) },
                  ]}
                  rows={byIsland.slice(0, 5)}
                />
              </Panel>
              <Panel title="Top customers by volume (this period)" style={{ flex: 1 }}>
                <Table
                  columns={[
                    { key: "customer", label: "Customer", emphasize: true },
                    { key: "cur", label: "Volume", align: "right", render: (r) => fmtL(r.cur) },
                  ]}
                  rows={byCustomer.slice(0, 5)}
                />
              </Panel>
            </div>
          </div>
        )}

        {section === "budget" && (
          <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
            <Panel
              title={`Monthly budget vs actual — ${year}`}
              right={<span style={{ fontSize: 11.5, color: T.sandDim }}>{loadingBudgets ? "Loading…" : isEditor ? "Editable — saved for everyone" : "View-only — unlock editing in the sidebar to set budgets"}</span>}
            >
              <div style={{ overflowX: "auto" }}>
                <table style={{ width: "100%", borderCollapse: "collapse", fontFamily: "'IBM Plex Sans'", fontSize: 13.5 }}>
                  <thead>
                    <tr>
                      {["Month", "Volume budget (L)", "Actual volume", "Attainment", "Value budget (MVR)", "Actual value", "Attainment", "Status"].map((h, i) => (
                        <th key={h} style={{ textAlign: i === 0 ? "left" : "right", padding: "8px 10px", color: T.sandDim, fontWeight: 500, borderBottom: `1px solid ${T.line}`, whiteSpace: "nowrap" }}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {monthlyBudgetRows.map((r) => {
                      const attain = r.attainVol != null ? r.attainVol : r.attainVal;
                      let status = "No budget set", statusColor = T.sandDim;
                      if (!r.hasActual) { status = "No data yet"; statusColor = T.sandDim; }
                      else if (attain != null) {
                        if (attain >= 100) { status = "On track"; statusColor = T.green; }
                        else if (attain >= 80) { status = "Behind"; statusColor = T.amber; }
                        else { status = "At risk"; statusColor = T.red; }
                      }
                      return (
                        <tr key={r.key} style={{ borderBottom: `1px solid ${T.line}` }}>
                          <td style={{ padding: "7px 10px", color: T.sand }}>{r.label}</td>
                          <td style={{ padding: "7px 10px", textAlign: "right" }}>
                            <input
                              type="number" defaultValue={r.budgetVol || ""} disabled={!isEditor}
                              onBlur={(e) => saveBudget(r.key, "volume", e.target.value)}
                              placeholder="—"
                              style={{ width: 90, background: T.panelAlt, border: `1px solid ${T.line}`, borderRadius: 3, color: isEditor ? T.sand : T.sandDim, padding: "4px 6px", textAlign: "right", fontSize: 13, opacity: isEditor ? 1 : 0.7 }}
                            />
                          </td>
                          <td style={{ padding: "7px 10px", textAlign: "right", color: T.sandDim, fontVariantNumeric: "tabular-nums" }}>{r.hasActual ? fmtL(r.actualVol) : "—"}</td>
                          <td style={{ padding: "7px 10px", textAlign: "right", color: T.sandDim, fontVariantNumeric: "tabular-nums" }}>{r.hasActual && r.attainVol != null ? `${r.attainVol.toFixed(0)}%` : "—"}</td>
                          <td style={{ padding: "7px 10px", textAlign: "right" }}>
                            <input
                              type="number" defaultValue={r.budgetVal || ""} disabled={!isEditor}
                              onBlur={(e) => saveBudget(r.key, "value", e.target.value)}
                              placeholder="—"
                              style={{ width: 100, background: T.panelAlt, border: `1px solid ${T.line}`, borderRadius: 3, color: isEditor ? T.sand : T.sandDim, padding: "4px 6px", textAlign: "right", fontSize: 13, opacity: isEditor ? 1 : 0.7 }}
                            />
                          </td>
                          <td style={{ padding: "7px 10px", textAlign: "right", color: T.sandDim, fontVariantNumeric: "tabular-nums" }}>{r.hasActual ? fmtMVR(r.actualVal) : "—"}</td>
                          <td style={{ padding: "7px 10px", textAlign: "right", color: T.sandDim, fontVariantNumeric: "tabular-nums" }}>{r.hasActual && r.attainVal != null ? `${r.attainVal.toFixed(0)}%` : "—"}</td>
                          <td style={{ padding: "7px 10px", textAlign: "right", color: statusColor, fontWeight: 500 }}>{status}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
              <div style={{ fontSize: 11, color: T.sandDim, marginTop: 12, lineHeight: 1.6 }}>
                Set a volume and/or value budget per month — click out of the field to save. Budgets are shared,
                same as uploaded sales sheets. "On track" means actual has met or beaten budget; "Behind" is
                80–99% of budget; "At risk" is under 80%.
              </div>
            </Panel>
          </div>
        )}

        {section === "yoy" && (
          <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
            <Panel title={`${MONTHS[month]} ${year} vs ${MONTHS[month]} ${year - 1}`}>
              <Table
                columns={[
                  { key: "metric", label: "Metric" },
                  { key: "py", label: `${year - 1}`, align: "right" },
                  { key: "cy", label: `${year}`, align: "right", emphasize: true },
                  { key: "change", label: "Change", align: "right" },
                ]}
                rows={[
                  { metric: "Volume sold", py: fmtL(priorQty), cy: fmtL(curQty), change: changeLabel(curQty, priorQty) },
                  { metric: "Sales value", py: fmtMVR(priorVal), cy: fmtMVR(curVal), change: changeLabel(curVal, priorVal) },
                  { metric: "Active customers", py: priorCust, cy: curCust, change: changeLabel(curCust, priorCust) },
                  { metric: "Avg. rate / litre", py: `MVR ${priorAvg.toFixed(2)}`, cy: `MVR ${curAvg.toFixed(2)}`, change: changeLabel(curAvg, priorAvg) },
                ]}
              />
            </Panel>
            <Panel title="Full year volume trend by year">
              <SimpleBarChart
                data={monthlyByYear} seriesKeys={years} T={T} fmt={fmtL}
                colors={years.map((y, i) => (i === years.length - 1 ? T.amber : T.cyan))}
              />
              <ChartLegend seriesKeys={years} T={T} colors={years.map((y, i) => (i === years.length - 1 ? T.amber : T.cyan))} />
            </Panel>
          </div>
        )}

        {section === "breakdowns" && (
          <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
            <Panel title={`By atoll — volume, ${year} vs ${year - 1}`}>
              <Table
                columns={[
                  { key: "atoll", label: "Atoll", emphasize: true },
                  { key: "prior", label: `${year - 1}`, align: "right", render: (r) => fmtL(r.prior) },
                  { key: "cur", label: `${year}`, align: "right", render: (r) => fmtL(r.cur) },
                  { key: "change", label: "Change", align: "right", render: (r) => changeLabel(r.cur, r.prior) },
                  { key: "curVal", label: "Sales value", align: "right", render: (r) => fmtMVR(r.curVal) },
                ]}
                rows={byAtoll}
              />
            </Panel>
            <Panel title={`By island — volume, ${year} vs ${year - 1}`} right={<span style={{ fontSize: 11.5, color: T.sandDim }}>Top 20 of {byIsland.length}</span>}>
              <Table
                columns={[
                  { key: "island", label: "Island", emphasize: true },
                  { key: "prior", label: `${year - 1}`, align: "right", render: (r) => fmtL(r.prior) },
                  { key: "cur", label: `${year}`, align: "right", render: (r) => fmtL(r.cur) },
                  { key: "change", label: "Change", align: "right", render: (r) => changeLabel(r.cur, r.prior) },
                  { key: "curVal", label: "Sales value", align: "right", render: (r) => fmtMVR(r.curVal) },
                ]}
                rows={byIsland.slice(0, 20)}
              />
            </Panel>
            <Panel title={`By shipping point / site — volume, ${year} vs ${year - 1}`}>
              <Table
                columns={[
                  { key: "shippingPoint", label: "Shipping point", emphasize: true },
                  { key: "prior", label: `${year - 1}`, align: "right", render: (r) => fmtL(r.prior) },
                  { key: "cur", label: `${year}`, align: "right", render: (r) => fmtL(r.cur) },
                  { key: "change", label: "Change", align: "right", render: (r) => changeLabel(r.cur, r.prior) },
                  { key: "curVal", label: "Sales value", align: "right", render: (r) => fmtMVR(r.curVal) },
                ]}
                rows={byShipPoint}
              />
            </Panel>
          </div>
        )}

        {section === "categories" && (
          <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
            <Panel
              title={`Sales by category — ${MONTHS[month]} ${year}`}
              right={<span style={{ fontSize: 11.5, color: T.sandDim }}>SOE, Government, Resorts, Island Delivery, Bunker, and more</span>}
            >
              <Table
                columns={[
                  { key: "category", label: "Category", emphasize: true },
                  { key: "quantity", label: "Volume", align: "right", render: (r) => fmtL(r.quantity) },
                  { key: "value", label: "Sales value", align: "right", render: (r) => fmtMVR(r.value) },
                  { key: "customers", label: "Customers", align: "right" },
                  { key: "margin", label: "Gross profit", align: "right", render: (r) => fmtMVR(r.margin) },
                  { key: "gpPerLitre", label: "GP / litre", align: "right", render: (r) => `MVR ${r.gpPerLitre.toFixed(2)}` },
                ]}
                rows={byCategory}
              />
              <div style={{ fontSize: 11, color: T.sandDim, marginTop: 12, lineHeight: 1.6 }}>
                Categories come straight from the SAP export's Main Category field. Government and SOE accounts
                (like FENAKA) often carry negative GP/litre under subsidized pricing — see the Profitability tab
                for the below-cost breakout.
              </div>
            </Panel>
          </div>
        )}

        {section === "customers" && (
          <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
            <div style={{ display: "flex", gap: 14, flexWrap: "wrap" }}>
              <StatCard label="Top 10 customer share" value={`${top10Share.toFixed(1)}%`} sub="of this period's volume" />
              <StatCard label="Top 20 customer share" value={`${top20Share.toFixed(1)}%`} sub="of this period's volume" />
              <StatCard label="Active customers" value={customerConcentration.length} sub={`in ${MONTHS[month]} ${year}`} />
            </div>

            <Panel title={`Customer concentration — ${MONTHS[month]} ${year}`} right={<span style={{ fontSize: 11.5, color: T.sandDim }}>Top 20, by cumulative volume share</span>}>
              <Table
                columns={[
                  { key: "rank", label: "#", render: (r, i) => i + 1 },
                  { key: "customer", label: "Customer", emphasize: true },
                  { key: "quantity", label: "Volume", align: "right", render: (r) => fmtL(r.quantity) },
                  { key: "share", label: "Share", align: "right", render: (r) => `${r.share.toFixed(1)}%` },
                  { key: "cumShare", label: "Cumulative", align: "right", render: (r) => `${r.cumShare.toFixed(1)}%` },
                  { key: "value", label: "Sales value", align: "right", render: (r) => fmtMVR(r.value) },
                ]}
                rows={customerConcentration.slice(0, 20)}
              />
            </Panel>

            <Panel
              title="Customer activity — where sales may be at risk"
              right={<span style={{ fontSize: 11.5, color: T.sandDim }}>Across all loaded months</span>}
            >
              {customerActivity.insufficientData ? (
                <div style={{ fontSize: 13, color: T.sandDim, lineHeight: 1.6 }}>
                  Only one month is currently loaded ({MONTHS[month]} {year}), so there's no prior period
                  to compare activity against yet. Upload another month's sheet (e.g. April or February) via
                  the sidebar and this will show lapsed and declining customers automatically — the same lens
                  as the island distributor reactivation work.
                </div>
              ) : (
                <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
                  <div>
                    <div style={{ fontSize: 12.5, color: T.sandDim, marginBottom: 8 }}>
                      Lapsed — bought before, nothing in the latest loaded month ({customerActivity.lapsed.length})
                    </div>
                    <Table
                      columns={[
                        { key: "customer", label: "Customer", emphasize: true },
                        { key: "priorQty", label: "Prior volume", align: "right", render: (r) => fmtL(r.priorQty) },
                      ]}
                      rows={customerActivity.lapsed.slice(0, 15)}
                    />
                  </div>
                  <div>
                    <div style={{ fontSize: 12.5, color: T.sandDim, marginBottom: 8 }}>
                      Declining — still buying, but down 20%+ vs their prior average ({customerActivity.declining.length})
                    </div>
                    <Table
                      columns={[
                        { key: "customer", label: "Customer", emphasize: true },
                        { key: "prior", label: "Prior avg. volume", align: "right", render: (r) => fmtL(r.prior) },
                        { key: "cur", label: "Latest month volume", align: "right", render: (r) => fmtL(r.cur) },
                        { key: "change", label: "Change", align: "right", render: (r) => changeLabel(r.cur, r.prior) },
                      ]}
                      rows={customerActivity.declining.slice(0, 15)}
                    />
                  </div>
                </div>
              )}
            </Panel>
          </div>
        )}

        {section === "profitability" && (
          <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
            <div style={{ display: "flex", gap: 14, flexWrap: "wrap" }}>
              <StatCard label="Gross profit (period)" value={fmtMVR(totalMargin)} sub={`${marginPct.toFixed(1)}% margin`} />
              <StatCard label="Avg. GP / litre" value={`MVR ${curQty ? (totalMargin / curQty).toFixed(2) : "0.00"}`} sub="blended across products" />
            </div>
            <Panel title={`Product performance — ${MONTHS[month]} ${year}`}>
              <Table
                columns={[
                  { key: "product", label: "Product", emphasize: true },
                  { key: "quantity", label: "Volume", align: "right", render: (r) => fmtL(r.quantity) },
                  { key: "value", label: "Sales value", align: "right", render: (r) => fmtMVR(r.value) },
                  { key: "margin", label: "Gross profit", align: "right", render: (r) => fmtMVR(r.margin) },
                  { key: "gpPerLitre", label: "GP / litre", align: "right", render: (r) => `MVR ${r.gpPerLitre.toFixed(2)}` },
                ]}
                rows={byProduct}
              />
            </Panel>
            <Panel title={`Top 10 customers by gross profit — ${MONTHS[month]} ${year}`} right={<span style={{ fontSize: 11.5, color: T.sandDim }}>Profit, not just revenue</span>}>
              <Table
                columns={[
                  { key: "customer", label: "Customer", emphasize: true },
                  { key: "quantity", label: "Volume", align: "right", render: (r) => fmtL(r.quantity) },
                  { key: "value", label: "Sales value", align: "right", render: (r) => fmtMVR(r.value) },
                  { key: "margin", label: "Gross profit", align: "right", render: (r) => fmtMVR(r.margin) },
                  { key: "gpPerLitre", label: "GP / litre", align: "right", render: (r) => `MVR ${r.gpPerLitre.toFixed(2)}` },
                ]}
                rows={customerProfitability}
              />
            </Panel>

            <Panel
              title={`Below-cost sales — ${MONTHS[month]} ${year}`}
              right={<span style={{ fontSize: 11.5, color: T.sandDim }}>Net value under COGS, kept separate from blended margins</span>}
            >
              <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginBottom: 16 }}>
                <StatCard label="Below-cost volume" value={fmtL(belowCostQty)} sub={`${belowCostShareOfVolume.toFixed(1)}% of period volume`} tone={belowCostShareOfVolume > 0 ? "down" : undefined} />
                <StatCard label="Below-cost sales value" value={fmtMVR(belowCostVal)} sub={`${belowCostSales.length} line items`} />
                <StatCard label="Margin lost" value={fmtMVR(belowCostMargin)} sub="sum of negative margin" tone="down" />
              </div>
              <Table
                columns={[
                  { key: "customer", label: "Customer", emphasize: true },
                  { key: "category", label: "Category" },
                  { key: "product", label: "Product" },
                  { key: "quantity", label: "Volume", align: "right", render: (r) => fmtL(r.quantity) },
                  { key: "value", label: "Sales value", align: "right", render: (r) => fmtMVR(r.value) },
                  { key: "cogs", label: "COGS", align: "right", render: (r) => fmtMVR(r.cogs) },
                  { key: "margin", label: "Margin", align: "right", render: (r) => fmtMVR(r.margin) },
                ]}
                rows={belowCostSales.slice(0, 25)}
              />
              {belowCostSales.length > 25 && (
                <div style={{ fontSize: 11.5, color: T.sandDim, marginTop: 10 }}>
                  Showing the 25 largest losses of {belowCostSales.length} below-cost line items this period.
                </div>
              )}
            </Panel>
          </div>
        )}

        {section === "whatif" && (
          <div style={{ display: "flex", gap: 18 }}>
            <Panel title="Scenario inputs" style={{ width: 300, flexShrink: 0 }}>
              <div style={{ marginBottom: 20 }}>
                <div style={{ fontSize: 12.5, color: T.sandDim, marginBottom: 6 }}>Volume change: {pctStr(volChange)}</div>
                <input type="range" min={-30} max={30} value={volChange} onChange={(e) => setVolChange(+e.target.value)} style={{ width: "100%" }} />
              </div>
              <div style={{ marginBottom: 20 }}>
                <div style={{ fontSize: 12.5, color: T.sandDim, marginBottom: 6 }}>Price change: {priceChange >= 0 ? "+" : ""}{priceChange.toFixed(2)} MVR/L</div>
                <input type="range" min={-1} max={1} step={0.05} value={priceChange} onChange={(e) => setPriceChange(+e.target.value)} style={{ width: "100%" }} />
              </div>
              <div>
                <div style={{ fontSize: 12.5, color: T.sandDim, marginBottom: 6 }}>Customer retention: {retention}%</div>
                <input type="range" min={50} max={100} value={retention} onChange={(e) => setRetention(+e.target.value)} style={{ width: "100%" }} />
              </div>
            </Panel>
            <div style={{ flex: 1, display: "flex", flexDirection: "column", gap: 14 }}>
              <Panel title={`Projected vs actual — ${MONTHS[month]} ${year}`}>
                <Table
                  columns={[
                    { key: "metric", label: "Metric" },
                    { key: "actual", label: "Actual", align: "right" },
                    { key: "proj", label: "Projected", align: "right", emphasize: true },
                    { key: "delta", label: "Change", align: "right" },
                  ]}
                  rows={[
                    { metric: "Volume", actual: fmtL(curQty), proj: fmtL(whatIf.projQty), delta: pctStr(pct(whatIf.projQty, curQty)) },
                    { metric: "Avg. rate / litre", actual: `MVR ${curAvg.toFixed(2)}`, proj: `MVR ${whatIf.projRate.toFixed(2)}`, delta: pctStr(pct(whatIf.projRate, curAvg)) },
                    { metric: "Sales value", actual: fmtMVR(curVal), proj: fmtMVR(whatIf.projVal), delta: pctStr(pct(whatIf.projVal, curVal)) },
                  ]}
                />
              </Panel>
              <StatCard
                label="Projected revenue impact"
                value={`${whatIf.deltaVal >= 0 ? "+" : ""}${fmtMVR(whatIf.deltaVal)}`}
                sub="vs actual, this period"
                tone={whatIf.deltaVal >= 0 ? "up" : "down"}
              />
            </div>
          </div>
        )}

        {section === "competitor" && (
          <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
            <Panel title="Competitor intelligence" right={<span style={{ fontSize: 11.5, color: T.amber }}>ESTIMATES — NOT SAP-VERIFIED</span>}>
              <Table
                columns={[
                  { key: "name", label: "Competitor", emphasize: true },
                  { key: "island", label: "Island" },
                  { key: "estPrice", label: "Est. price (MVR/L)", align: "right", render: (r) => r.estPrice.toFixed(2) },
                  { key: "note", label: "Note" },
                ]}
                rows={COMPETITOR_SAMPLE}
              />
              <div style={{ fontSize: 12, color: T.sandDim, marginTop: 14, lineHeight: 1.6 }}>
                Placeholder module. Populate with verified pricing, presence by island, and won/lost customer
                notes as you gather them — kept separate so estimates are never mixed with actual SAP figures.
              </div>
            </Panel>
          </div>
        )}
      </div>
    </div>
    </ThemeContext.Provider>
  );
}

const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<FSMDashboard />);

</script>

<!-- Manually transform + run the app source above, instead of relying on Babel Standalone's
     automatic <script type="text/babel"> page-scan (which had a version-drift bug causing
     "Cannot use import statement outside a module" on some Babel Standalone releases). This
     gives us explicit control over sourceType so it can never be misdetected as an ES module. -->
<script>
  (function () {
    var src = document.getElementById("app-source").textContent;
    try {
      var output = Babel.transform(src, { presets: ["react"], sourceType: "script" }).code;
      var s = document.createElement("script");
      s.textContent = output;
      document.body.appendChild(s);
    } catch (err) {
      document.getElementById("root").innerHTML =
        '<div style="padding:40px;font-family:sans-serif;color:#D9695F;white-space:pre-wrap;">' +
        "Failed to start the dashboard:\n\n" + (err && err.message ? err.message : err) + "</div>";
      console.error(err);
    }
  })();
</script>
</body>
</html>
